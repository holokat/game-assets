<!doctype html><html lang="en"><meta charset="utf-8"><title>Playground responsive review</title><style>body{margin:24px;font:14px system-ui;background:#eee9e0;color:#514b41}iframe{border:1px solid #bdb4a5;display:block;margin:20px auto;background:white}output{display:block;max-width:900px;line-height:1.6}button{padding:12px}h1{font-size:22px}</style><h1>Playground responsive review</h1><output id="result">Checking compact layouts…</output><iframe id="preview" title="Mobile playground preview" width="390" height="844"></iframe><script type="module">
const frame=document.getElementById('preview'),result=document.getElementById('result'),checks=[];
const sleep=ms=>new Promise(resolve=>setTimeout(resolve,ms));
try{
 for(const [width,height] of [[320,568],[390,844],[667,375],[844,390]]){
  frame.width=width;frame.height=height;
  for(const mode of ['armor','farm','effects','character','items','abilities','structures','world']){
   frame.src='/fantasy-studio/?workspace='+mode;
   await new Promise(resolve=>frame.onload=resolve);
   let ready=false;
   for(let i=0;i<100;i++){const w=frame.contentWindow;if(w.studio?.workspace.mode===mode&&(['armor','farm'].includes(mode)?w.studio.collections.model:true)){ready=true;break;}await sleep(100);}
   if(!ready)throw new Error('Preview timed out: '+mode);
   await sleep(250);const d=frame.contentDocument,w=frame.contentWindow;
   if(d.documentElement.scrollWidth>width+1)throw new Error('Horizontal overflow: '+width+' '+mode+' '+JSON.stringify([...d.querySelectorAll('body *')].filter(e=>{const r=e.getBoundingClientRect();return r.width&&r.right>width+1}).map(e=>[e.tagName,e.id,e.className,e.getBoundingClientRect().right]).slice(0,15)));
   const canvas=d.getElementById('scene').getBoundingClientRect();
   if(canvas.width<150||canvas.height<180)throw new Error('Preview too small: '+width+' '+mode);
   const inspector=d.getElementById(({effects:'living-inspector',world:'living-inspector',character:'material-inspector',items:'item-inspector',abilities:'ability-inspector',structures:'structure-inspector'}[mode]||'collection-inspector')).getBoundingClientRect();
   if(width<=900&&(inspector.width<150||inspector.height<100))throw new Error('Inspector inaccessible: '+width+' '+mode);
   if(w.studio.errors.length)throw new Error(w.studio.errors.join('\n'));
   checks.push(`${width} × ${height}: ${mode}`);w.studio.dispose();
  }
 }
 result.textContent='Responsive checks passed. '+checks.join('; ');document.title=result.textContent;
 await fetch('/__report',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({responsive:{passed:true,checks}})});
 frame.width=390;frame.height=844;frame.src='/fantasy-studio/?workspace=farm';
}catch(error){result.textContent=String(error.stack||error);document.title=String(error);await fetch('/__report',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({responsive:{passed:false,error:String(error)}})});}
</script></html>
